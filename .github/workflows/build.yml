name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache
      - run: pip install --upgrade pip buildozer cython==3.0.11 setuptools
      - run: buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: AH-Irfan-apk
          path: bin/*.apk
